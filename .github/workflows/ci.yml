# SPDX-License-Identifier: Apache-2.0 OR MIT
name: conformance
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  python:
    name: Python reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python validator.py --validate vectors
  c:
    name: C FFI (static_assert layout + byte parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gcc -std=c11 -Wall -Wextra -Iinclude tests/c_roundtrip.c -o c_roundtrip
          ./c_roundtrip
  javascript:
    name: JavaScript binding (byte parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node bindings/javascript/test.js
  java:
    name: Java binding (byte parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - run: java bindings/java/AxonosRfc0006.java
